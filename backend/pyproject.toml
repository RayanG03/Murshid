[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas==3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdfium2>=5.13.0",
    "pyyaml>=6.0.3",
    "sentence-transformers==6.0.1",
    "torch==2.14.0",
    "transformers==5.16.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
